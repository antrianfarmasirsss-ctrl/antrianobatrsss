<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antrian Farmasi RSUD Sultan Suriansyah Banjarmasin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100dvh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9; user-select: none;
    }
    input { user-select: text; }
    .scroll-area-y { overflow-y: auto; scrollbar-width: thin; }
    .scroll-area-x { overflow-x: auto; scrollbar-width: thin; }
    .smooth-box { transition: flex 0.35s ease; }
    .smooth-num { transition: font-size 0.35s ease; }
  </style>
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-7xl mx-auto bg-slate-100 text-slate-800">

  <!-- HEADER -->
  <header class="bg-emerald-900 text-white px-3 sm:px-5 py-2 flex items-center justify-between shadow-md shrink-0">
    <div id="secretTrigger" class="cursor-pointer active:opacity-80 pr-2">
      <h1 class="text-sm sm:text-lg lg:text-xl font-bold leading-tight tracking-tight">
        Farmasi RSUD Sultan Suriansyah Banjarmasin
      </h1>
      <div class="flex items-center gap-1.5 text-[11px] sm:text-xs lg:text-sm text-emerald-200 mt-0.5">
        <span class="font-medium">Depo Central Farmasi</span>
        <span>•</span>
        <span id="witaClock">Memuat waktu...</span>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 shrink-0 justify-end">
      <!-- QR CODE MODE PASIEN (UNTUK TV / LAYAR RUANG TUNGGU) -->
      <div id="patientQrWidget" onclick="openQrModal()" title="Klik untuk memperbesar QR" class="cursor-pointer bg-white text-emerald-950 rounded-xl px-2 py-1 flex items-center gap-2 shadow-sm border border-emerald-200 active:scale-95">
        <div id="headerQrcodeBox" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center shrink-0"></div>
        <div class="hidden sm:flex flex-col leading-tight pr-0.5">
          <span class="text-[9px] font-extrabold uppercase tracking-wider text-emerald-700">Pantau dari HP</span>
          <span class="text-[11px] font-black text-slate-900">Scan QR / Ketik:</span>
          <span class="text-[10px] font-bold text-emerald-800">tinyurl.com/antrianfarmasirsss</span>
        </div>
      </div>

      <!-- STATUS & TOMBOL MODE PETUGAS -->
      <div class="flex items-center gap-1.5 flex-wrap justify-end">
        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
        <span id="modeBadge" class="text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-800 text-emerald-100 border border-emerald-700">
          PASIEN
        </span>
        <button id="btnUndoReset" onclick="undoResetAll()" class="hidden bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-xs px-2.5 py-1 rounded shadow-sm active:scale-95">
          ↩ Undo Reset
        </button>
        <button id="btnResetAll" onclick="confirmResetAll()" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-2.5 py-1 rounded shadow-sm active:scale-95">
          Reset
        </button>
        <button id="btnQr" onclick="openQrModal()" class="hidden bg-white text-emerald-900 font-bold text-xs px-2.5 py-1 rounded shadow-sm active:scale-95">
          QR
        </button>
        <button id="btnLogout" onclick="logoutStaff()" class="hidden bg-rose-600 text-white font-bold text-xs px-2.5 py-1 rounded shadow-sm active:scale-95">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col gap-1.5 sm:gap-2 p-2 sm:p-2.5 min-h-0">
    <!-- BAGIAN 1: ANTRIAN UTAMA (DINAMIS MENYESUAIKAN JUMLAH BARIS RACIKAN) -->
    <section id="secUtama" class="smooth-box flex-[1.55] grid grid-cols-3 gap-2 sm:gap-2.5 min-h-0">
      <div class="bg-white rounded-2xl border-[3px] border-sky-500 p-1.5 sm:p-2.5 flex flex-col items-center justify-between shadow-sm min-h-0">
        <span class="w-full text-center bg-sky-600 text-white text-[10px] sm:text-xs lg:text-sm font-extrabold py-0.5 sm:py-1 rounded-lg tracking-wide shrink-0">
          UMUM (A)
        </span>
        <div class="flex-1 flex items-center justify-center w-full min-h-0">
          <div id="valA" class="smooth-num text-5xl sm:text-7xl lg:text-8xl font-black text-slate-800 tracking-tight leading-none">
            A0
          </div>
        </div>
        <div class="staff-only hidden w-full grid grid-cols-3 gap-1 mt-0.5 shrink-0">
          <button onclick="stepCounter('A', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs py-1 rounded-lg active:scale-95">-1</button>
          <button onclick="stepCounter('A', 1)" class="col-span-2 bg-sky-600 hover:bg-sky-700 text-white font-extrabold text-xs py-1 rounded-lg shadow-sm active:scale-95">NEXT</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl border-[3px] border-emerald-600 p-1.5 sm:p-2.5 flex flex-col items-center justify-between shadow-sm min-h-0">
        <span class="w-full text-center bg-emerald-700 text-white text-[10px] sm:text-xs lg:text-sm font-extrabold py-0.5 sm:py-1 rounded-lg tracking-wide shrink-0">
          BPJS (B)
        </span>
        <div class="flex-1 flex items-center justify-center w-full min-h-0">
          <div id="valB" class="smooth-num text-5xl sm:text-7xl lg:text-8xl font-black text-slate-800 tracking-tight leading-none">
            B0
          </div>
        </div>
        <div class="staff-only hidden w-full grid grid-cols-3 gap-1 mt-0.5 shrink-0">
          <button onclick="stepCounter('B', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs py-1 rounded-lg active:scale-95">-1</button>
          <button onclick="stepCounter('B', 1)" class="col-span-2 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs py-1 rounded-lg shadow-sm active:scale-95">NEXT</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl border-[3px] border-amber-500 p-1.5 sm:p-2.5 flex flex-col items-center justify-between shadow-sm min-h-0">
        <span class="w-full text-center bg-amber-500 text-white text-[10px] sm:text-xs lg:text-sm font-extrabold py-0.5 sm:py-1 rounded-lg tracking-wide shrink-0">
          PRIORITAS (C)
        </span>
        <div class="flex-1 flex items-center justify-center w-full min-h-0">
          <div id="valC" class="smooth-num text-5xl sm:text-7xl lg:text-8xl font-black text-slate-800 tracking-tight leading-none">
            C0
          </div>
        </div>
        <div class="staff-only hidden w-full grid grid-cols-3 gap-1 mt-0.5 shrink-0">
          <button onclick="stepCounter('C', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs py-1 rounded-lg active:scale-95">-1</button>
          <button onclick="stepCounter('C', 1)" class="col-span-2 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs py-1 rounded-lg shadow-sm active:scale-95">NEXT</button>
        </div>
      </div>
    </section>

    <!-- BAGIAN 2: OBAT SEDANG DIRACIK (DINAMIS MEMBESAR SAAT ITEM BERTAMBAH) -->
    <section id="secDiracik" class="smooth-box flex-[0.85] bg-white rounded-2xl border-2 border-indigo-600 p-2 sm:p-2.5 flex flex-col min-h-0 shadow-sm">
      <div class="w-full bg-indigo-600 text-white px-3 py-1 rounded-lg flex items-center justify-between gap-2 mb-1.5 shrink-0">
        <h2 class="text-[11px] sm:text-sm lg:text-base font-extrabold uppercase tracking-wide">
          OBAT SEDANG DIRACIK
        </h2>
        <button onclick="undoLast('diracik')" class="staff-only hidden bg-white/20 hover:bg-white/30 text-white border border-white/40 text-[11px] font-bold px-2 py-0.5 rounded active:scale-95">
          ↩ Undo
        </button>
      </div>
      <form onsubmit="handleAddItems(event, 'diracik')" class="staff-only hidden flex gap-1.5 mb-1.5 shrink-0">
        <input id="inputDiracik" type="text" placeholder="Ketik nomor (cth: A12, C3, B5)..." class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1 text-xs sm:text-sm font-semibold uppercase" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-lg shrink-0">Tambah</button>
      </form>
      <div id="listDiracik" class="scroll-area-y flex-1 flex flex-wrap content-start gap-1.5 sm:gap-2">
        <p class="w-full text-center text-xs sm:text-sm text-slate-400 italic my-auto">Belum ada antrian diracik</p>
      </div>
    </section>

    <!-- BAGIAN 3: OBAT SEDANG DIKONFIRMASI (1 BARIS) -->
    <section class="flex-[0.6] bg-white rounded-2xl border-2 border-rose-600 p-2 sm:p-2.5 flex flex-col justify-between min-h-0 shadow-sm">
      <div class="w-full bg-rose-600 text-white px-3 py-1 rounded-lg flex items-center justify-between gap-2 mb-1 shrink-0">
        <h2 class="text-[11px] sm:text-sm lg:text-base font-extrabold uppercase tracking-wide">
          OBAT SEDANG DIKONFIRMASI
        </h2>
        <button onclick="undoLast('konfirmasi')" class="staff-only hidden bg-white/20 hover:bg-white/30 text-white border border-white/40 text-[11px] font-bold px-2 py-0.5 rounded active:scale-95">
          ↩ Undo
        </button>
      </div>
      <form onsubmit="handleAddItems(event, 'konfirmasi')" class="staff-only hidden flex gap-1.5 mb-1 shrink-0">
        <input id="inputKonfirmasi" type="text" placeholder="Ketik nomor (cth: A10, C2, B8)..." class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1 text-xs sm:text-sm font-semibold uppercase" />
        <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-
