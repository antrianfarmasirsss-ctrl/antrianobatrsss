<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antrian Farmasi RSUD Sultan Suriansyah Banjarmasin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] max-w-4xl mx-auto bg-slate-100 shadow-sm">

  <!-- HEADER: JUDUL RS (KETUK/KLIK 5X UNTUK LOGIN PETUGAS) & WAKTU REALTIME -->
  <header class="bg-emerald-800 text-white px-3 py-2 shrink-0 shadow">
    <div class="flex items-center justify-between gap-2">
      <div id="secret-trigger" class="cursor-pointer active:opacity-80 flex-1 min-w-0">
        <h1 class="text-sm sm:text-base font-extrabold leading-tight tracking-tight truncate">
          Farmasi RSUD Sultan Suriansyah Banjarmasin
        </h1>
        <div class="flex items-center gap-2 text-[11px] sm:text-xs text-emerald-100 mt-0.5">
          <span>Depo Central Farmasi</span>
          <span>•</span>
          <span id="live-datetime" class="font-medium">Memuat waktu...</span>
        </div>
      </div>

      <!-- STATUS KONEKSI & TOMBOL KHUSUS PETUGAS -->
      <div class="flex items-center gap-1.5 shrink-0">
        <span id="conn-dot" title="Status Koneksi Database" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
        <span id="mode-badge" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-emerald-950/60 text-emerald-200">
          Pasien
        </span>
        <button id="btn-qr" onclick="openQrModal()" class="hidden bg-white text-emerald-900 hover:bg-emerald-50 text-xs font-bold px-2.5 py-1 rounded shadow-sm active:scale-95">
          QR
        </button>
        <button id="btn-reset" onclick="resetAll()" class="hidden bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-2 py-1 rounded shadow-sm active:scale-95">
          Reset
        </button>
        <button id="btn-logout" onclick="logoutPetugas()" class="hidden bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-2 py-1 rounded shadow-sm active:scale-95">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA (PAS 1 LAYAR HP) -->
  <main class="flex-1 flex flex-col justify-between p-2 sm:p-3 gap-2 overflow-hidden">

    <!-- BARIS 1: 3 KOTAK SEJAJAR (UMUM A, BPJS B, PRIORITAS C) -->
    <section class="grid grid-cols-3 gap-2 shrink-0">
      <!-- KOTAK A: UMUM -->
      <div class="bg-white rounded-xl border-2 border-sky-500 shadow-sm flex flex-col justify-between p-2 text-center">
        <div class="bg-sky-600 text-white text-[11px] sm:text-xs font-extrabold py-0.5 rounded-md tracking-wide">
          UMUM (A)
        </div>
        <div id="val-A" class="text-3xl sm:text-5xl font-black text-sky-950 my-2 sm:my-3 tracking-tight">
          A0
        </div>
        <div class="admin-only hidden grid grid-cols-3 gap-1">
          <button onclick="updateCounter('A', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-extrabold text-xs sm:text-sm py-2 rounded-lg">
            -1
          </button>
          <button onclick="updateCounter('A', 1)" class="col-span-2 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-extrabold text-xs sm:text-sm py-2 rounded-lg shadow">
            NEXT
          </button>
        </div>
      </div>

      <!-- KOTAK B: BPJS -->
      <div class="bg-white rounded-xl border-2 border-emerald-500 shadow-sm flex flex-col justify-between p-2 text-center">
        <div class="bg-emerald-600 text-white text-[11px] sm:text-xs font-extrabold py-0.5 rounded-md tracking-wide">
          BPJS (B)
        </div>
        <div id="val-B" class="text-3xl sm:text-5xl font-black text-emerald-950 my-2 sm:my-3 tracking-tight">
          B0
        </div>
        <div class="admin-only hidden grid grid-cols-3 gap-1">
          <button onclick="updateCounter('B', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-extrabold text-xs sm:text-sm py-2 rounded-lg">
            -1
          </button>
          <button onclick="updateCounter('B', 1)" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm py-2 rounded-lg shadow">
            NEXT
          </button>
        </div>
      </div>

      <!-- KOTAK C: PRIORITAS -->
      <div class="bg-white rounded-xl border-2 border-amber-500 shadow-sm flex flex-col justify-between p-2 text-center">
        <div class="bg-amber-500 text-slate-950 text-[11px] sm:text-xs font-extrabold py-0.5 rounded-md tracking-wide">
          PRIORITAS (C)
        </div>
        <div id="val-C" class="text-3xl sm:text-5xl font-black text-amber-950 my-2 sm:my-3 tracking-tight">
          C0
        </div>
        <div class="admin-only hidden grid grid-cols-3 gap-1">
          <button onclick="updateCounter('C', -1)" class="col-span-1 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-extrabold text-xs sm:text-sm py-2 rounded-lg">
            -1
          </button>
          <button onclick="updateCounter('C', 1)" class="col-span-2 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-extrabold text-xs sm:text-sm py-2 rounded-lg shadow">
            NEXT
          </button>
        </div>
      </div>
    </section>

    <!-- BARIS 2: OBAT SEDANG DIRACIK -->
    <section class="flex-1 bg-white rounded-xl border border-slate-300 shadow-sm p-2.5 flex flex-col justify-between min-h-0">
      <div class="flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
          <h2 class="text-xs sm:text-sm font-extrabold uppercase tracking-wide text-slate-800">
            Obat Sedang Diracik
          </h2>
        </div>
        <button id="undo-racik" onclick="undoList('racik')" class="admin-only hidden text-[11px] font-bold bg-slate-200 hover:bg-slate-300 text-slate-800 px-2 py-0.5 rounded">
          Undo
        </button>
      </div>

      <!-- DAFTAR HORIZONTAL MEMANJANG KE SAMPING (A -> C -> B, ANGKA TERKECIL) -->
      <div id="list-racik" class="flex-1 flex items-center gap-2 overflow-x-auto no-scrollbar py-1.5 px-0.5">
        <span class="text-xs text-slate-400 italic">Belum ada antrian diracik</span>
      </div>

      <!-- INPUT MANUAL PETUGAS -->
      <form onsubmit="handleAdd(event, 'racik')" class="admin-only hidden flex gap-1.5 shrink-0 pt-1 border-t border-slate-100">
        <input
          id="input-racik"
          type="text"
          placeholder="Ketik no (cth: A12, C2, B5)"
          autocomplete="off"
          class="flex-1 min-w-0 text-xs sm:text-sm border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-600 uppercase"
        />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg shrink-0">
          + Tambah
        </button>
      </form>
    </section>

    <!-- BARIS 3: OBAT SEDANG DIKONFIRMASI -->
    <section class="flex-1 bg-white rounded-xl border border-slate-300 shadow-sm p-2.5 flex flex-col justify-between min-h-0">
      <div class="flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span>
          <h2 class="text-
